# Enable Mouse/Trackball Support
CONFIG_ZMK_POINTING=y

# Bluetooth Reliability (Fix for Windows PHY issues)
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Nice!View Display Support
CONFIG_ZMK_DISPLAY=y

# PMW3610 Trackball (Badjeff Driver)
CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_ORIENTATION_90=y

# Power Management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_PM_SOFT_OFF=y

# Combos for Mouse Functions
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16
