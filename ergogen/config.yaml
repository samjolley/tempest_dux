# ===============================================================================
# TEMPEST_DUX - wireless split ergonomic keyboard with integrated PMW3610 trackball
# -------------------------------------------------------------------------------
# Lineage : rae-dux / track-dux column geometry (validated on Sam's daily driver)
# Stack   : ergogen v4.2.1 -> KiCad 8 -> JLCPCB ;  ZMK on nRF52840 (nice!nano v2)
# Repo    : https://github.com/samjolley/tempest_dux
#
# -- v0.7.x ARCHITECTURE: two dedicated single-sided boards (NOT reversible) -----
# The old reversible board (one gerber, flipped, peripherals DNP per side) is gone.
# v0.7 splits into two distinct single-sided gerbers generated from ONE points
# tree via an ergogen global mirror:
#
#     SOURCE hand (unprefixed pts: matrix_*, thumb_*) = LEFT  half = DISPLAY
#     MIRROR hand (mirror_* pts)                       = RIGHT half = TRACKBALL
#
# Handedness is verified, not assumed: in the source hand the pinky is leftmost and
# the inner column rightmost => that is the LEFT hand. The mirror is therefore the
# RIGHT hand, which carries the trackball. Do not swap these.
#
# -- MIRROR MECHANISM (read before editing geometry) ----------------------------
#   points.mirror: {ref: matrix_inner_home, distance: 160}  -> emits mirror_* pts.
#   ergogen does the reflection (x flipped, rotation negated), so there is NO manual
#   KiCad mirror step. The reflection is exact, incl. the asymmetric thumb cluster.
#
#   Hand isolation uses POSITIVE name regex on `where`:
#       source/left  : where: /^(matrix_|thumb_).*/
#       mirror/right : where: /^mirror_(matrix_|thumb_).*/
#   WARNING: do NOT use a negative lookahead like /^(?!mirror)/ - ergogen does not
#   honor it; it silently matches BOTH hands and the board spans both halves.
#   Single-point footprints use the matching ref prefix: left = matrix_inner_home,
#   right = mirror_matrix_inner_home, etc.
#
# -- ELECTRONICS / PINOUT (one ZMK keymap serves both halves) --------------------
#   Matrix rows : P4 P5 P6 P7          (identical both boards)
#   Matrix cols : P14 P15 P18 P19 P20  (identical both boards)
#   Display SPI : P1=CS  P2=MOSI P3=SCK                  -> LEFT board only
#   PMW3610 SPI : P10=CS P9=SCLK P8=SDIO P21=MOTION (3-wire) -> RIGHT board only
#   elec_* units (top of `units`) tune shared X/Y placement; elec_switch_right_x
#   adds a +1.4mm X nudge for the rotated SMD side power switch on the RIGHT only.
#
# -- OUTLINES & PLATES -----------------------------------------------------------
#   Source outlines (display_board_outline, keyboard_body, left_bottom_plate_outline)
#     = LEFT board (no trackball lobe).
#   right_* outlines (right_trackball_board_outline, right_bottom_plate_outline)
#     = RIGHT board (trackball lobe + cleanout).
#   Switch/top/TPU/back plates are built from the SOURCE (left) hand and are
#   symmetric - mirror them in the slicer for the right half. Bottom plates are
#   per-hand; only the right one has the trackball cleanout.
#
# -- PRE-ORDER CHECKLIST (custom footprints + DRC are not checkable from YAML) ----
#   [ ] 1:1 paper print BOTH halves; confirm key + trackball + thumb fit.
#   [ ] KiCad: switches/diodes/hotswap all on the same physical side (B.Cu) on BOTH
#       boards - confirm the mirror did not flip any footprint to F.Cu.
#   [ ] Confirm reverse_mount:true on the MCU is intended; check USB-C direction.
#   [ ] Verify right power switch (rotate 180 + elec_switch_right_x) position.
#   [ ] Custom footprints resolve: pmw3610_badjeff_socket, keyball_trackball_case_34mm,
#       TentingPuck, choc_hotswap_plate_cutout, smd_plate_cutout.
#   [ ] DRC clean on both boards (vias at 0.6/0.3mm sit at min annular ring).
#
# -- CHANGELOG -------------------------------------------------------------------
#   v0.7.5 : silk ver -> v0.7.5; branding text consolidated to side F; right reset
#            offset corrected (THT uses elec_switch_x, not SMD elec_switch_right_x).
#   v0.7.4 : ergogen global mirror; positive-regex hand isolation; handedness fixed
#            (trackball on mirror/right hand, display on source/left hand).
#   v0.7.0 : split reversible board into two single-sided boards; dropped reversible
#            footprints, MCU jumper field, and redundant vertical display.
# ===============================================================================
meta:
  engine: 4.2.1
  version: 0.7.5
  author: sam jolley
  url: https://github.com/samjolley/tempest_dux
units:
  kx: cx
  ky: cy
  px: kx + 4
  py: ky + 4
  voff: 7
  mcu_offset: 6
  mcu_right_pad: 6
  # Shared electronics placement controls for v0.7.x asymmetric halves.
  # Left footprints use source anchors; right footprints use mirror_* anchors.
  # Adjust these values once, then regenerate both halves.
  elec_main_x: 19.8 + mcu_offset
  elec_mcu_y: 17 - voff
  elec_display_y: 13 - voff
  elec_battery_y: 35 - voff
  elec_switch_x: 36.6 + mcu_offset
  # Right power/reset footprint origin needs a small X compensation because the side-switch footprint is rotated.
  elec_switch_right_x: elec_switch_x + 1.4
  elec_power_y: -25 - voff
  elec_reset_y: -37 - voff
  elec_bay_x: 19.5 + mcu_offset + 2.5
  elec_bay_y: -19.655 - voff
  board_fillet: 1.8
  standoff_size: 2
  hole1_x: 0.62 kx
  hole1_y: 0.2 ky
  hole2_x: 0.53 kx
  hole2_y: 0.62 ky
  hole3_x: 0.57 kx
  hole3_y: 0 ky
  hole4_x: 0.53 kx
  hole4_y: -0.4 ky
  hole5_x: -0.58 kx - 1.1
  hole5_y: 0.4 ky - 1.7
  hole6_x: -0.525 kx
  hole6_y: -1.525 ky
  hole7_x: 1.568 kx
  hole7_y: -1.5 ky
  wall_thickness: 1.2
  print_fit_tolerance: 0.2
  $default_width: 18
  $default_height: 17
  pmw_x: -39.6
  pmw_y: -1.5 ky
  pmw_rotate: 95
  pmw_optical_x: pmw_x - 1
  pmw_optical_y: pmw_y - 2
  pmw_board_w: 15.5
  pmw_board_h: 30.0
  pmw_ball_cutout_d: 13
  pmw_socket_pad_dia: 1.8
  pmw_socket_drill: 1.0
  pmw_bridge_dx: -19
  pmw_bridge_dy: 3.6
  pmw_bridge_w: 26
  pmw_bridge_h: 15.09
  tb_case_slot_w: 18.4
  tb_case_slot_l: 30.0
  tb_case_body_w: 35.0
  tb_case_body_l: 45
  tb_cleanout_d: 12
  tb_cleanout_r: tb_cleanout_d / 2
  tb_screw_drill: 1.6
  tb_screw_ox: 1.51
  tb_screw_oy: 7.98
points:
  zones:
    matrix:
      anchor.shift:
      - 50
      - -100
      key:
        padding: 1ky
        spread: 1kx
      columns:
        pinky:
          key:
            spread: 18
            splay: 17
            origin:
            - 0
            - -ky
            bind:
            - 0 kx
            - 0 kx
            - 0.1 kx
            - 0 kx
            column_net: col_pinky
        ring:
          key:
            spread: 18
            stagger: ky
            splay: -7
            origin:
            - 0
            - -ky
            bind:
            - 0 kx
            - 0.1 kx
            - 0.05 ky
            - 0.08 kx
            column_net: col_ring
        middle:
          key:
            spread: 18
            stagger: ky/3
            splay: -5
            origin:
            - 0
            - -ky
            bind:
            - 0 kx
            - 0.1 kx
            - 0.05 kx
            - 0.1 kx
            adjust:
              shift:
              - 0.2
              - 0
            column_net: col_middle
        index:
          key:
            spread: 18
            stagger: -ky/3
            splay: -5
            origin:
            - 0
            - -ky
            bind:
            - 0 kx
            - -0.1 kx
            - 0.05 kx
            - 0 kx
            column_net: col_index
        inner:
          key:
            spread: 19
            stagger: -ky/6
            origin:
            - 0
            - -ky
            bind:
            - 0.158 kx
            - 0.05 kx
            - 0.1 kx
            - 0.1 kx
            column_net: col_inner
      rows:
        bottom:
          row_net: row_bottom
        home:
          row_net: row_home
        top:
          row_net: row_top
    thumb:
      anchor:
        ref: matrix_inner_bottom
        shift:
        - -0.10 kx
        - -1.0 ky
      key:
        padding: 1ky
        spread: 1kx
      columns:
        near:
          key:
            spread: kx
            splay: -15
            origin:
            - -1.5 kx
            - -0.5 ky
            name: thumb_near
            column_net: col_middle
        mid:
          key:
            spread: kx
            splay: -15
            origin:
            - -0.5 kx
            - -0.5 ky
            name: thumb_mid
            column_net: col_index
        far:
          key:
            spread: kx
            splay: -15
            origin:
            - -0.5 kx
            - -0.5 ky
            name: thumb_far
            column_net: col_inner
      rows:
        thumb-cluster:
          row_net: row_thumb
  # Global mirror -> emits mirror_* points (RIGHT hand). See header for the full
  # mechanism. Hand isolation: source=/^(matrix_|thumb_).*/, mirror=/^mirror_(matrix_|thumb_).*/.
  # Never filter with a negative lookahead (/^(?!mirror)/) - ergogen ignores it.
  mirror:
    ref: matrix_inner_home
    distance: 160
outlines:
  raw:
  - what: rectangle
    where: /^(matrix_|thumb_).*/
    size:
    - px
    - py
  keys:
  - what: rectangle
    where: /^(matrix_|thumb_).*/
    size:
    - kx-0.5
    - ky-0.5
  key-plug:
  - what: rectangle
    where: /^(matrix_|thumb_).*/
    size:
    - 13.8
    - 13.8
  key-plug-fdm:
  - what: rectangle
    where: /^(matrix_|thumb_).*/
    size:
    - 13.82
    - 13.62
  - what: circle
    where: /^(matrix_|thumb_).*/
    radius: 0.45
    adjust:
      shift:
      - 6.975
      - 6.975
  - what: circle
    where: /^(matrix_|thumb_).*/
    radius: 0.45
    adjust:
      shift:
      - -6.975
      - 6.975
  - what: circle
    where: /^(matrix_|thumb_).*/
    radius: 0.45
    adjust:
      shift:
      - 6.975
      - -6.975
  - what: circle
    where: /^(matrix_|thumb_).*/
    radius: 0.45
    adjust:
      shift:
      - -6.975
      - -6.975
  key-plug-loose:
  - what: rectangle
    where: /^(matrix_|thumb_).*/
    size:
    - 14.25
    - 14.25
  column_gap_bound:
  - what: rectangle
    where: /^matrix_(pinky|ring|middle|index|inner)_(top|home|bottom)$/
    size:
    - px
    - py
    bound: true
  pmw_breakout_preview:
  - what: rectangle
    where:
      ref: matrix_inner_bottom
      shift:
      - pmw_optical_x
      - pmw_optical_y
      rotate: pmw_rotate
    size:
    - pmw_board_w
    - pmw_board_h
    corner: 1
  pmw_socket_pcb_area:
  - what: rectangle
    where:
      ref: matrix_inner_bottom
      shift:
      - pmw_optical_x + pmw_bridge_dx
      - pmw_optical_y + pmw_bridge_dy
      rotate: pmw_rotate
    size:
    - pmw_bridge_w
    - pmw_bridge_h
    corner: 1
  pmw_ball_cutout:
  - what: circle
    where:
      ref: matrix_inner_bottom
      shift:
      - pmw_optical_x
      - pmw_optical_y
    radius: pmw_ball_cutout_d / 2
  trackball_cleanout_hole:
  - what: circle
    where:
      ref: matrix_inner_bottom
      shift:
      - pmw_optical_x
      - pmw_optical_y
      rotate: pmw_rotate
    radius: tb_cleanout_r
  trackball_slot_opening:
  - what: rectangle
    where:
      ref: matrix_inner_bottom
      shift:
      - pmw_optical_x
      - pmw_optical_y
      rotate: pmw_rotate
    size:
    - tb_case_slot_w
    - tb_case_slot_l
    corner: 1
  trackball_case_body:
  - what: rectangle
    where:
      ref: matrix_inner_bottom
      shift:
      - pmw_optical_x + 4
      - pmw_optical_y + 5
      rotate: pmw_rotate
    size:
    - tb_case_body_w
    - tb_case_body_l
    corner: 2
  mcu:
  - what: rectangle
    where:
      ref: matrix_inner_top
      shift:
      - elec_bay_x
      - elec_bay_y
    size:
    - 33
    - 80
  power_cutout:
  - what: rectangle
    where:
      ref: matrix_inner_home
      shift:
      - elec_switch_x
      - elec_power_y
      rotate: 0
    size:
    - 9.5
    - 6.5
  reset_cutout:
  - what: rectangle
    where:
      ref: matrix_inner_home
      shift:
      - elec_switch_x
      - elec_reset_y
      rotate: 90
    size:
    - 8.5
    - 4.5
  thumb_outline:
  - what: polygon
    operation: stack
    points:
    - ref: thumb_near
      shift:
      - -0.7px
      - 0.5py
    - ref: matrix_inner_bottom
      shift:
      - 0.15px
      - -0.08py
    - ref: thumb_far
      shift:
      - -0.5px
      - 0.5py
    - ref: thumb_far
      shift:
      - 0.51px
      - 0.51py
    - ref: thumb_far
      shift:
      - 0.5px
      - -0.5py
    - ref: thumb_far
      shift:
      - -0.5px
      - -0.5075py
    - ref: thumb_near
      shift:
      - 0.5px
      - -0.5py
    - ref: thumb_near
      shift:
      - -0.5px
      - -0.5py
  key_section:
  - name: raw
  - operation: add
    name: column_gap_bound
  - operation: add
    name: thumb_outline
  key_thumb_mcu:
  - name: key_section
  - operation: add
    name: mcu
  keyboard_body:
  - name: key_thumb_mcu
    expand: 0.2
    fillet: board_fillet
  display_board_outline:
  - name: keyboard_body
  trackball_board_outline:
  - name: keyboard_body
  - operation: add
    name: pmw_socket_pcb_area
    fillet: board_fillet
  - operation: add
    name: trackball_case_body
    expand: wall_thickness + print_fit_tolerance
    fillet: board_fillet
  right_raw:
  - what: rectangle
    where: /^mirror_(matrix_|thumb_).*/
    size:
    - px
    - py
  right_keys:
  - what: rectangle
    where: /^mirror_(matrix_|thumb_).*/
    size:
    - kx-0.5
    - ky-0.5
  right_column_gap_bound:
  - what: rectangle
    where: /^mirror_matrix_(pinky|ring|middle|index|inner)_(top|home|bottom)$/
    size:
    - px
    - py
    bound: true
  right_thumb_outline:
  - what: polygon
    operation: stack
    points:
    - ref: mirror_thumb_near
      shift:
      - -0.7px
      - 0.5py
    - ref: mirror_matrix_inner_bottom
      shift:
      - 0.15px
      - -0.08py
    - ref: mirror_thumb_far
      shift:
      - -0.5px
      - 0.5py
    - ref: mirror_thumb_far
      shift:
      - 0.51px
      - 0.51py
    - ref: mirror_thumb_far
      shift:
      - 0.5px
      - -0.5py
    - ref: mirror_thumb_far
      shift:
      - -0.5px
      - -0.5075py
    - ref: mirror_thumb_near
      shift:
      - 0.5px
      - -0.5py
    - ref: mirror_thumb_near
      shift:
      - -0.5px
      - -0.5py
  right_pmw_breakout_preview:
  - what: rectangle
    where:
      ref: mirror_matrix_inner_bottom
      shift:
      - pmw_optical_x
      - pmw_optical_y
      rotate: pmw_rotate
    size:
    - pmw_board_w
    - pmw_board_h
    corner: 1
  right_pmw_socket_pcb_area:
  - what: rectangle
    where:
      ref: mirror_matrix_inner_bottom
      shift:
      - pmw_optical_x + pmw_bridge_dx
      - pmw_optical_y + pmw_bridge_dy
      rotate: pmw_rotate
    size:
    - pmw_bridge_w
    - pmw_bridge_h
    corner: 1
  right_pmw_ball_cutout:
  - what: circle
    where:
      ref: mirror_matrix_inner_bottom
      shift:
      - pmw_optical_x
      - pmw_optical_y
    radius: pmw_ball_cutout_d / 2
  right_trackball_cleanout_hole:
  - what: circle
    where:
      ref: mirror_matrix_inner_bottom
      shift:
      - pmw_optical_x
      - pmw_optical_y
      rotate: pmw_rotate
    radius: tb_cleanout_r
  right_trackball_slot_opening:
  - what: rectangle
    where:
      ref: mirror_matrix_inner_bottom
      shift:
      - pmw_optical_x
      - pmw_optical_y
      rotate: pmw_rotate
    size:
    - tb_case_slot_w
    - tb_case_slot_l
    corner: 1
  right_trackball_case_body:
  - what: rectangle
    where:
      ref: mirror_matrix_inner_bottom
      shift:
      - pmw_optical_x + 4
      - pmw_optical_y + 5
      rotate: pmw_rotate
    size:
    - tb_case_body_w
    - tb_case_body_l
    corner: 2
  right_mcu:
  - what: rectangle
    where:
      ref: mirror_matrix_inner_top
      shift:
      - elec_bay_x
      - elec_bay_y
    size:
    - '33'
    - '80'
  right_power_cutout:
  - what: rectangle
    where:
      ref: mirror_matrix_inner_home
      shift:
      - elec_switch_x
      - elec_power_y
      rotate: 0
    size:
    - '9.5'
    - '6.5'
  right_reset_cutout:
  - what: rectangle
    where:
      ref: mirror_matrix_inner_home
      shift:
      - elec_switch_x
      - elec_reset_y
      rotate: 90
    size:
    - '8.5'
    - '4.5'
  right_key_section:
  - name: right_raw
  - operation: add
    name: right_column_gap_bound
  - operation: add
    name: right_thumb_outline
  right_key_thumb_mcu:
  - name: right_key_section
  - operation: add
    name: right_mcu
  right_keyboard_body:
  - name: right_key_thumb_mcu
    expand: 0.2
    fillet: board_fillet
  right_trackball_board_outline:
  - name: right_keyboard_body
  - operation: add
    name: right_pmw_socket_pcb_area
    fillet: board_fillet
  - operation: add
    name: right_trackball_case_body
    expand: wall_thickness + print_fit_tolerance
    fillet: board_fillet
  board_outline:
  - name: right_trackball_board_outline
  switch_plate_cutouts:
  - key-plug-fdm
  switch_plate_cutouts_loose:
  - key-plug-loose
  switch_plate:
  - name: key_section
    expand: 0.2
  - operation: subtract
    name: switch_plate_cutouts
    fillet: board_fillet
  tpu_gasket_outline:
  - name: key_section
    expand: 0.2
  - operation: subtract
    name: switch_plate_cutouts_loose
    fillet: board_fillet
  top_plate:
  - name: key_section
    expand: 0.2
  - operation: subtract
    name: switch_plate_cutouts_loose
    fillet: board_fillet
  back_plate:
  - name: key_section
    expand: wall_thickness + print_fit_tolerance
  - operation: subtract
    name: switch_plate_cutouts_loose
    fillet: board_fillet
  left_bottom_plate_outline:
  - name: display_board_outline
    fillet: board_fillet
  - operation: subtract
    name: power_cutout
  - operation: subtract
    name: reset_cutout
  right_bottom_plate_outline:
  - name: right_trackball_board_outline
    fillet: board_fillet
  - operation: subtract
    name: right_trackball_cleanout_hole
  - operation: subtract
    name: right_power_cutout
  - operation: subtract
    name: right_reset_cutout
  bottom_plate_outline:
  - name: right_bottom_plate_outline
  all_key_outline:
  - name: board_outline
  - operation: subtract
    name: keys
pcbs:
  tempest_dux-left:
    template: kicad8
    outlines:
      main:
        outline: display_board_outline
    footprints:
      choc_hotswap:
        what: ceoloide/switch_choc_v1_v2
        where: /^(matrix_|thumb_).*/
        params:
          from: '{{colrow}}'
          to: '{{column_net}}'
          include_corner_marks: true
          include_keycap: true
          keycap_height: 16.5
          keycap_width: 17.5
          reversible: false
          hotswap: true
          choc_v2_support: false
          side: B
      diode:
        what: ceoloide/diode_tht_sod123
        where: /^(matrix_|thumb_).*/
        adjust:
          shift:
          - 0
          - -5
        params:
          from: '{{colrow}}'
          to: '{{row_net}}'
          include_tht: false
          reversible: false
          side: B
      mcu:
        what: ceoloide/mcu_nice_nano
        where:
        - ref: matrix_inner_home
          shift:
          - elec_main_x
          - elec_mcu_y
        params:
          reversible: false
          reverse_mount: true
          show_silk_labels: true
          P4: row_top
          P5: row_home
          P6: row_bottom
          P7: row_thumb
          P14: col_inner
          P15: col_index
          P18: col_middle
          P19: col_ring
          P20: col_pinky
          P1: CS
          P2: MOSI
          P3: SCK
      display:
        what: ceoloide/display_nice_view
        where:
        - ref: matrix_inner_home
          shift:
          - elec_main_x
          - elec_display_y
          rotate: 0
        params:
          reversible: false
          include_labels: true
          MOSI: MOSI
          SCK: SCK
          CS: CS
      battery_direct:
        what: ceoloide/battery_direct_solder_reversible
        where:
        - ref: matrix_inner_home
          shift:
          - elec_main_x
          - elec_battery_y
          rotate: 0
        params:
          reversible: false
          BAT_P: BAT_P
          BAT_N: GND
      power:
        what: ceoloide/power_switch_smd_side
        where:
        - ref: matrix_inner_home
          shift:
          - elec_switch_x
          - elec_power_y
          rotate: 0
        params:
          reversible: false
          from: BAT_P
          to: RAW
      reset:
        what: ceoloide/reset_switch_tht_top
        where:
        - ref: matrix_inner_home
          shift:
          - elec_switch_x
          - elec_reset_y
          rotate: 90
        params:
          reversible: false
      tempest_text:
        what: ceoloide/utility_text
        where:
        - ref: matrix_index_home
          shift:
          - 0
          - -0.5ky + 1.45
        params:
          text: TEMPEST_DUX L
          side: F
          height: 2
          width: 2
          knockout: true
          reversible: false
      ver:
        what: ceoloide/utility_text
        where:
