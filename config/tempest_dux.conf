# Pointing / trackball (badjeff zmk-pmw3610-driver, pulled in via config/west.yml)
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y

# Miryoku combos need extra combo slots per key
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16

# Bluetooth reliability with Windows hosts
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Bring-up: keep halves awake (USB powered, no batteries yet; deep sleep
# masks debugging). Re-enable CONFIG_ZMK_SLEEP once on battery.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_PM_SOFT_OFF=y
